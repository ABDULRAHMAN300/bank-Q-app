*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
body[data-fs="1"]{--fs:20px}body[data-fs="2"]{--fs:22px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Kufi Arabic','Noto Serif',system-ui,sans-serif;line-height:1.85;direction:rtl;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.board{font-size:1.4rem}
body.pr{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.f{direction:ltr;unicode-bidi:isolate;font-family:'Noto Serif',serif;white-space:normal;display:inline-block;max-width:100%;text-align:left;overflow-wrap:anywhere}
.f sub,.f sup{font-size:.68em;line-height:0}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
/* header */
header{background:linear-gradient(135deg,var(--h),var(--h2));color:#fff;padding:calc(.45rem + env(safe-area-inset-top)) .8rem .45rem;display:flex;align-items:center;gap:.5rem;position:sticky;top:0;z-index:20;box-shadow:0 2px 12px rgba(0,0,0,.18)}
header .t{flex:1;font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
header button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header button.on{background:var(--surface);color:var(--h)}
main{max-width:760px;margin:0 auto;padding:1rem 1rem 1.5rem;overflow-x:hidden}
body.board main{max-width:1100px}
h1,h2{color:var(--h);line-height:1.5;margin:.3rem 0}
h1{font-size:1.4rem}h2{font-size:1.1rem}
.uh{margin:1.4rem 0 .6rem;font-size:1.05rem;display:flex;align-items:center;gap:.5rem}
.uh:before{content:"";width:6px;height:1.2em;border-radius:4px;background:linear-gradient(var(--h),var(--h2))}
.sub,small{color:var(--mut);font-size:.8rem;display:block;line-height:1.6}
/* hero */
.hero{background:linear-gradient(135deg,var(--h),var(--h2));color:#fff;border-radius:var(--r);padding:1.1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);left:-50px;top:-70px}
.hero h1{color:#fff;margin:0;font-size:1.3rem}.hero p{margin:.2rem 0 0;opacity:.92;font-size:.85rem}
.hero .ring{color:#fff}.hero .rb{stroke:rgba(255,255,255,.25)}.hero .rf{stroke:#fff}
.hero.res{flex-direction:column;text-align:center;padding:1.6rem 1rem}
.hero.res>div{display:grid;justify-items:center;gap:.4rem}
.bigic{font-size:2.6rem}
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;fill:none}
.ring circle{stroke-width:5}
.rb{stroke:var(--card)}.rf{stroke:var(--h);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{font-size:.78rem;position:relative;color:inherit}
.lc .ring b{color:var(--h)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.8rem 0}
.stats3>div{background:var(--surface);border-radius:16px;padding:.6rem;text-align:center;box-shadow:var(--sh)}
.stats3 b{display:block;color:var(--h);font-size:1.15rem;line-height:1.4}.stats3 span{font-size:.72rem;color:var(--mut)}
.resume{display:flex;align-items:center;gap:.8rem;background:var(--surface);border-radius:16px;padding:.7rem .9rem;margin:.6rem 0;box-shadow:var(--sh);border-right:6px solid var(--h2)}
.resume.warn{border-right-color:#F59E0B}
.resume small{font-size:.72rem}.resume b{display:block;color:var(--h);font-size:.92rem;line-height:1.5}
.rs-i{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--h),var(--h2));color:#fff;display:grid;place-items:center;flex:none}
.warn .rs-i{background:#F59E0B}
/* segmented */
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;margin:1rem 0 .8rem}
.seg button{flex:1;border:0;background:transparent;padding:.45rem .2rem;border-radius:999px;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--mut);min-height:44px}

.slist{display:grid;gap:.6rem}

@keyframes inl{from{opacity:0;transform:translateX(-26px)}}@keyframes inr{from{opacity:0;transform:translateX(26px)}}

// ---- بيانات ----
function lessons(){const L=[];BANKS.forEach(b=>(b.units||[]).forEach(u=>u.lessons.forEach(l=>L.push({b,u,l}))));return L}
const lessonById=id=>lessons().find(x=>x.l.id===id);

function ring(p,sz,label){sz=sz||56;const r=sz/2-5,c=2*Math.PI*r;return '<span class="ring" style="width:'+sz+'px;height:'+sz+'px"><svg viewBox="0 0 '+sz+' '+sz+'"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" class="rb"/><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" class="rf" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 '+sz/2+' '+sz/2+')"/></svg><b>'+(label!==undefined?label:Math.round(p*100)+'%')+'</b></span>'}
const bar=p=>'<div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div>';
function setView(o){
  $('#ttl').innerHTML=o.title||'';

// ---- بطاقة سؤال ----
const solHtml=(it)=>it.final?'<div class="final"><small>✅ الإجابة النهائية</small><b>'+R(it.final)+'</b></div>':'';
const IMG=(d,c)=>d?'<img class="qi '+(c||'')+'" src="'+d+'" alt="">':'';
function termOptions(it,pool){const others=shuffle([...new Set(pool.filter(x=>x.type==='term'&&x.a!==it.a).map(x=>x.a))]).slice(0,3);const o=shuffle([it.a,...others]);return{o,a:o.indexOf(it.a)}}
function blankHtml(it,show){let i=0;return R(it.q).replace(/___/g,()=>{const a=it.a[i++];return show?'<span class="blank shown">'+R(a)+'</span>':'<span class="blank">&nbsp;&nbsp;&nbsp;؟&nbsp;&nbsp;&nbsp;</span>'})}
function card(it,cfg){
  const el=document.createElement('div');el.className='q';
  const exam=cfg.exam;let done=false;
  const head='<div class="meta"><span class="tag t-'+it.type+'">'+TICON[it.type]+' '+TYPES[it.type]+'</span><span class="mr">'+(it.ref?'<span class="ref">📖 '+T(it.ref)+'</span>':'')+(exam?'':'<button class="fav'+(S.fav[it.id]?' on':'')+'" aria-label="حفظ السؤال">'+(S.fav[it.id]?'★':'☆')+'</button>')+'</span></div>';
  const finish=(ok)=>{if(done)return;done=true;mark(it.id,ok);cfg.onDone&&cfg.onDone(ok)};
  if(it.type==='tf'||it.type==='mcq'||it.type==='term'){
    let opts,ans;
    if(it.type==='tf'){opts=['صحيحة','خاطئة'];ans=it.a?0:1}
    else if(it.type==='mcq'){opts=it.o;ans=it.a}
    else{const t=termOptions(it,cfg.pool);opts=t.o;ans=t.a}
    const isTF=it.type==='tf';
    el.innerHTML=head+'<div class="qt">'+R(it.q)+'</div>'+IMG(it.img)+'<div class="opts'+(isTF?' tf':'')+'">'+opts.map((o,i)=>'<button class="opt'+(isTF?(i?' no':' yes'):'')+'" data-i="'+i+'">'+(isTF?'<span class="ic">'+(i?'✕':'✓')+'</span>':'<span class="lt">'+LET[i]+'</span>')+'<span class="ot">'+R(o)+'</span></button>').join('')+'</div><div class="fb-slot"></div>';
    const bs=[...el.querySelectorAll('.opt')];
    const reveal=(pick)=>{
      bs.forEach((b,i)=>{b.disabled=true;if(!exam){if(i===ans)b.classList.add('right');else if(i===pick)b.classList.add('wrong')}else if(i===pick)b.classList.add('picked')});
      if(pick!==undefined){const ok=pick===ans;finish(ok);cfg.picks&&(cfg.picks[it.id]=pick);
        if(!exam){el.classList.add(ok?'ok-flash':'no-flash');el.querySelector('.fb-slot').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'إجابة صحيحة، أحسنت ✓':'إجابة غير صحيحة. الصحيح: '+R(opts[ans]))+'</div>'+solHtml(it)+IMG(it.aimg,'ai')}}
      else if(!exam){el.querySelector('.fb-slot').innerHTML='<div class="fb ok">الإجابة الصحيحة: '+R(opts[ans])+'</div>'+solHtml(it)+IMG(it.aimg,'ai')}
    };
    bs.forEach((b,i)=>b.onclick=()=>reveal(i));
    el.reveal=()=>{if(!done&&!exam){reveal(undefined)}};
  }else{
    const isB=it.type==='blank';
    el.innerHTML=head+'<div class="qt">'+(isB?blankHtml(it,false):R(it.q))+'</div>'+IMG(it.img)+'<div class="slot"></div><div class="rate"></div>';
    const slot=el.querySelector('.slot'),rate=el.querySelector('.rate');let shown=false;
    const show=()=>{if(shown)return;shown=true;
      if(isB){el.querySelector('.qt').innerHTML=blankHtml(it,true);slot.innerHTML=IMG(it.aimg,'ai')+solHtml(it)}
      else if(it.final)slot.innerHTML=solHtml(it);
      else slot.innerHTML='<div class="ans">'+(it.a==null||it.a===''?'<span class="sub">(الإجابة في الصورة)</span>':R(it.a))+'</div>'+IMG(it.aimg,'ai');
      rate.innerHTML='<div class="row"><button class="btn ok y">عرفتها ✓</button><button class="btn no n">أحتاج مراجعة ✗</button></div>';
      rate.querySelector('.y').onclick=()=>{finish(true);rate.innerHTML='<div class="fb ok">تم التسجيل ✓</div>';el.classList.add('ok-flash')};
      rate.querySelector('.n').onclick=()=>{finish(false);rate.innerHTML='<div class="fb no">أُضيف إلى مراجعة الأخطاء</div>';el.classList.add('no-flash')};
    };
    el.reveal=show;
  }
  const fb=el.querySelector('.fav');if(fb)fb.onclick=e=>{e.stopPropagation();if(S.fav[it.id])delete S.fav[it.id];else S.fav[it.id]=1;save();fb.classList.toggle('on',!!S.fav[it.id]);fb.textContent=S.fav[it.id]?'★':'☆';toast(S.fav[it.id]?'حُفظ السؤال في «مراجعتي» ⭐':'أُزيل من المحفوظة')};
  return el;
}

  h+='<div class="subjs">';

    else if(b.status==='locked')h+='<button class="subj lockd" data-unlock="'+b.id+'"'+sty+'><span class="ic">'+b.icon+'</span><span class="sb"><b>'+b.subject+'</b><small>هذا البنك مقفل</small><span class="pill">🔑 أدخل الكود</span></span><span class="lk">🔒</span></button>';
    else h+='<div class="subj dis"'+sty+'><span class="ic">'+b.icon+'</span><span class="sb"><b>'+b.subject+'</b><small>لم يُضف بعد</small><span class="pill">قريباً</span></span></div>'});
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.grade=+b.dataset.g;save();home()});bindInstall();
  app.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>codeModal());
}
function bankPage(id){
  const b=BANKS.find(x=>x.id===id),bs=bankStat(b);
  setView({title:b.subject+' '+b.grade,back:true,tab:'home'});
  let h='<section class="hero sub-hero"><div class="hero-t"><h1>'+b.subject+' — الصف '+GRADES[b.grade]+'</h1><p>'+b.period+' · '+N(bs.n)+' سؤال</p></div>'+ring(bs.n?bs.d/bs.n:0,72)+'</section>';
  b.units.forEach((u,ui)=>{const ready=u.lessons.filter(l=>l.ready);if(!ready.length)return;
    const us=stat([].concat(...ready.map(flat)));
    h+='<details class="unit"'+(ui===0||b.units.length===1?' open':'')+'><summary><span class="ut"><b>'+T(u.title)+'</b><small>'+N(ready.length)+' دروس · '+N(us.n)+' سؤال · أنجزت '+N(us.n?Math.round(us.d/us.n*100):0)+'%</small></span><span class="chev">⌄</span></summary>';
    let ch='';
    u.lessons.forEach(l=>{if(l.ch&&l.ch!==ch){ch=l.ch;h+='<div class="chh">'+T(ch)+'</div>'}
      if(!l.ready)return;
      const s=lessonStat(l),pos=S.pos['/p/'+l.id+'/all'];
      h+='<div class="lc"><a class="lc-h" href="#/l/'+l.id+'">'+ring(s.n?s.d/s.n:0,52)+'<span class="lc-t"><b>'+T(l.title)+'</b><small>'+N(s.n)+' سؤال · صحيح '+N(s.ok)+' من '+N(s.d)+'</small></span><span class="go">‹</span></a>'+
      '<div class="row"><a class="btn pri" href="#/p/'+l.id+'/all">'+(pos?'▶ تابع من السؤال '+N(pos+1):'▶ تدريب')+'</a><a class="btn" href="#/x/'+l.id+'">⏱ اختبار</a><a class="btn" href="#/l/'+l.id+'">الأقسام</a></div></div>'});
    h+='</details>'});
  app.innerHTML=h;
}

function session(o){
  // o:{qs,pool,title,key,route,label,exam,onEnd,endLabel}
  const qs=o.qs;let i=Math.min(S.pos[o.key]||0,qs.length-1);if(o.exam)i=0;let streak=0;
  setView({title:o.title,back:true,pr:true,tab:o.tab||'home'});
  const wrap=document.createElement('div');app.innerHTML='';app.appendChild(wrap);
  if(o.route&&!o.exam){S.last={route:o.route,label:o.label};save()}
  const go=(d)=>{i+=d;if(!o.exam){S.pos[o.key]=i;save()}draw(d)};
  function draw(dir){
    if(i>=qs.length){if(!o.exam){delete S.pos[o.key];save()}return o.onEnd?o.onEnd():finish()}
    const it=qs[i];
    wrap.innerHTML='<div class="ph"><span class="pc">'+fr(i+1,qs.length)+'</span><span class="ps">'+T(shortSec(it.sec||'')||'')+'</span>'+(o.exam?'<span class="timer" id="tm">'+mmss(o.left())+'</span>':(streak>=2?'<span class="streak">🔥 '+N(streak)+'</span>':''))+'</div>'+bar(i/qs.length);
    const c=card(it,{pool:o.pool,exam:o.exam,picks:o.picks,onDone:ok=>{streak=ok?streak+1:0;if(o.exam)o.onAnswer&&o.onAnswer(it,ok);nx.classList.add('pri');if(!o.exam&&ok&&streak>=2){const s=wrap.querySelector('.streak')||wrap.querySelector('.ph').appendChild(Object.assign(document.createElement('span'),{className:'streak'}));s.innerHTML='🔥 '+N(streak)}}});
    c.classList.add(dir<0?'in-r':'in-l');wrap.appendChild(c);
    const ab=document.createElement('div');ab.className='abar';
    ab.innerHTML='<button class="ib pv" aria-label="السابق">›</button>'+(o.exam?'':'<button class="btn rv">إظهار الإجابة</button>')+'<button class="btn nx">'+(i===qs.length-1?'إنهاء':'التالي ‹')+'</button>';
    wrap.appendChild(ab);const nx=ab.querySelector('.nx');
    const pv=ab.querySelector('.pv');pv.disabled=i===0||o.exam;pv.onclick=()=>go(-1);
    const rv=ab.querySelector('.rv');if(rv)rv.onclick=()=>c.reveal&&c.reveal();
    nx.onclick=()=>go(1);
    wrap.keyh=e=>{if(e.key==='ArrowLeft')go(1);else if(e.key==='ArrowRight'&&i>0&&!o.exam)go(-1);else if((e.key===' '||e.key==='Enter')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();c.reveal&&c.reveal()}};
    window.scrollTo(0,0);
  }
  function finish(){
    const ok=qs.filter(q=>S.prog[q.id]===true).length;
    wrap.innerHTML='<section class="hero res"><div>'+ring(qs.length?ok/qs.length:0,110,fr(ok,qs.length))+'<h1>أحسنت! انتهت الجلسة 🎉</h1><p>إجابات صحيحة أو معروفة: '+N(ok)+' من '+N(qs.length)+'</p></div></section><div class="row"><a class="btn pri" href="#'+(o.back||'/')+'">رجوع</a><a class="btn" href="#/wrong">↻ مراجعة الأخطاء</a></div>'}
  const swipe={x:0};app.ontouchstart=e=>{swipe.x=e.touches[0].clientX};app.ontouchend=e=>{const dx=e.changedTouches[0].clientX-swipe.x;if(Math.abs(dx)>70){if(dx<0)go(1);else if(i>0&&!o.exam)go(-1)}};
  window.__key=e=>wrap.keyh&&wrap.keyh(e);
  draw(1);
}
function practice(id,sec,customQs,title){
  const x=id&&lessonById(id);let qs;
  if(customQs)qs=customQs;else{qs=flat(x.l);if(sec!=='all')qs=qs.filter(q=>q.sec===x.l.sections[+sec].title)}
  const route=customQs?'/wrong'+(id?'/'+id:''):'/p/'+id+'/'+sec;
  session({qs,pool:customQs?allQs():flat(x.l),title:title||T(stitle(x.l.title)),key:route,route:customQs?null:route,label:customQs?'':x.l.title+(sec==='all'?'':' — '+secNum(x.l.sections[+sec].title)),back:id?'/l/'+id:'/',tab:customQs?'wrong':'home'});
}

function runExam(x,qs,pool){

  window.__stop=()=>clearInterval(tick);
  const correct=q=>q.type==='tf'?(q.a?'صحيحة':'خاطئة'):q.type==='mcq'?q.o[q.a]:q.a;
  function end(){clearInterval(tick);
    const bad=qs.filter(q=>res[q.id]!==true);const sc=qs.length-bad.length;
    bad.forEach(q=>{S.wrong[q.id]=1});save();

      '<div class="row" style="margin-top:1rem"><a class="btn pri" href="#/x/'+x.l.id+'">اختبار جديد</a><a class="btn" href="#/l/'+x.l.id+'">رجوع للدرس</a></div>';setView({title:'نتيجة الاختبار',back:true,tab:'home'})}
  session({qs,pool,title:'اختبار تجريبي',exam:true,key:'exam',left:()=>left,picks,onAnswer:(it,ok)=>{res[it.id]=ok},onEnd:end,back:'/l/'+x.l.id});
}

// ---- الدخول بالأكواد: كل كود يفتح بنوكه فقط (البيانات مشفّرة) ----
const CKEY='bank_codes';
const UNL=new Set();
const normCode=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const ub=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const bankName=id=>{const b=BANKS.find(x=>x.id===id);return b?b.subject+' '+(GRADES[b.grade]||''):id};
function loadCodes(){try{const a=JSON.parse(localStorage.getItem(CKEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function saveCodes(a){try{localStorage.setItem(CKEY,JSON.stringify([...new Set(a)]))}catch(e){}}
async function unlock(code){
  const V=window.VAULT,sub=crypto.subtle,out=[];
  const base=await sub.importKey('raw',new TextEncoder().encode(normCode(code)),'PBKDF2',false,['deriveKey']);
  const kek=await sub.deriveKey({name:'PBKDF2',salt:ub(V.s),iterations:V.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  for(const k of V.keys){
    let raw;try{raw=await sub.decrypt({name:'AES-GCM',iv:ub(k.i)},kek,ub(k.w))}catch(e){continue}
    try{const e=V.banks[k.b];
      const ct=e.ct?ub(e.ct):new Uint8Array(await (await fetch(e.f,{cache:'no-cache'})).arrayBuffer());
      const dk=await sub.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      const pt=await sub.decrypt({name:'AES-GCM',iv:ub(e.iv)},dk,ct);
      out.push(JSON.parse(new TextDecoder().decode(pt)));
    }catch(e){out.netErr=true}
  }
  return out;
}
function applyBanks(list){list.forEach(d=>{const i=BANKS.findIndex(x=>x.id===d.id);if(i>=0)BANKS[i]=d;else BANKS.push(d);UNL.add(d.id)})}
function pickGrade(list){const c=list.find(d=>d.units)||list[0];if(c){S.grade=c.grade;save()}}
function toast(t){const e=document.createElement('div');e.className='toast';e.innerHTML='<span>'+t+'</span>';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function codeForm(slot,onOk,msg){
  slot.innerHTML='<form class="lk-f" autocomplete="off"><label>أدخل كود الدخول</label><input dir="ltr" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="CH112027" maxlength="24"><button class="btn pri" type="submit">دخول</button><div class="lk-msg">'+(msg||'')+'</div></form>';
  const f=slot.querySelector('form'),inp=f.querySelector('input'),m=f.querySelector('.lk-msg'),bt=f.querySelector('button');
  f.onsubmit=async e=>{e.preventDefault();const c=normCode(inp.value);if(c.length<4){m.textContent='اكتب الكود كاملاً.';return}
    bt.disabled=true;bt.textContent='جارٍ التحقق…';m.textContent='';
    const list=await unlock(c).catch(()=>[]);
    if(list.length){applyBanks(list);saveCodes(loadCodes().concat([c]));onOk(list)}
    else if(list.netErr){bt.disabled=false;bt.textContent='دخول';m.textContent='الكود صحيح ✓ لكن تعذّر تحميل البنك. اتصل بالإنترنت وحاول مرة أخرى (يحتاج التحميل مرة واحدة فقط).'}
    else{try{navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})}catch(e){}bt.disabled=false;bt.textContent='دخول';m.textContent='الكود غير صحيح، تأكد منه وحاول مرة أخرى.';inp.select();f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake')}};
  setTimeout(()=>inp.focus(),60);
}
function lockScreen(msg){
  document.body.classList.add('locked');
  app.innerHTML='<div class="lock"><img src="icons/icon-192.png" alt="" class="lk-ic" onerror="this.style.display=\'none\'"><h1>بنوك الأسئلة التفاعلية</h1><p class="lk-by">إعداد أ/ عبدالرحمن يوسف</p><div class="lk-slot"></div><p class="lk-h">اطلب كود بنك صفّك ومادتك من معلمك. يُكتب الكود مرة واحدة فقط على هذا الجهاز.</p></div>';
  codeForm(app.querySelector('.lk-slot'),list=>{pickGrade(list);open_();toast('تم فتح: '+list.map(d=>bankName(d.id)).join('، '))},msg);
}
function codeModal(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="mbox"><h3 class="mh">🔑 فتح بنك جديد</h3><div class="lk-slot"></div><button class="btn n" style="margin-top:.6rem;width:100%">إلغاء</button></div>';
  document.body.appendChild(m);m.querySelector('.n').onclick=()=>m.remove();
  codeForm(m.querySelector('.lk-slot'),list=>{m.remove();pickGrade(list);toast('تم فتح: '+list.map(d=>bankName(d.id)).join('، '));route()});
}
function open_(){document.body.classList.remove('locked');if(!BANKS.some(b=>b.grade===S.grade&&b.units)){const f=BANKS.find(b=>b.units);if(f){S.grade=f.grade;save()}}route()}
window.__logout=()=>{try{localStorage.removeItem(CKEY);localStorage.removeItem('bank_code')}catch(e){}location.reload()};
async function boot(){
  if(!window.VAULT)return route();
  if(!(window.crypto&&crypto.subtle)){document.body.classList.add('locked');app.innerHTML='<div class="lock"><h1>المتصفح غير مدعوم</h1><p>افتح التطبيق من Safari أو Chrome حديث.</p></div>';return}
  const codes=loadCodes();try{const o=localStorage.getItem('bank_code');if(o){codes.push(o);localStorage.removeItem('bank_code')}}catch(e){}
  if(codes.length){
    document.body.classList.add('locked');app.innerHTML='<div class="lock"><img src="icons/icon-192.png" alt="" class="lk-ic"><p>جارٍ الفتح…</p></div>';
    const ok=[];for(const c of codes){const l=await unlock(c).catch(()=>[]);if(l.length){applyBanks(l);ok.push(c)}}
    saveCodes(ok);
    if(ok.length)return open_();
    return lockScreen('انتهت صلاحية الكود المحفوظ. أدخل الكود الجديد.');
  }
  lockScreen();
}
boot();
})();
</script></body></html>
